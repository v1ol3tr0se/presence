name: ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["24", "26"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: yarn

      - name: install strace and openssl
        run: |
          if ! command -v strace >/dev/null || ! command -v openssl >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends strace openssl
          fi

      - run: yarn install --frozen-lockfile --non-interactive
      - run: yarn verify
